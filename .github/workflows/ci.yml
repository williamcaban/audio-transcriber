name: CI

# Fast dev-loop feedback: lint + tests, on every PR and push. Building and
# publishing the actual deployable artifacts (container image, macOS .app)
# is handled by release.yml instead, on push to main / version tags only --
# merging that concern here would mean running the same heavy builds twice
# on every push to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # Caches both backends' downloaded model weights (~GB each) across
      # runs. Keyed on a fixed name since neither model is pinned to a
      # revision -- bump the key (e.g. -v2) if upstream weights change and
      # the cache goes stale.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      - run: uv run pytest -v
