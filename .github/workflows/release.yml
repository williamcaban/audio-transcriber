name: Release

# Two kinds of release, both built from the same jobs:
# - A version tag (v0.1.0, ...) publishes a real, permanent release: the
#   container image tagged with that version (and "latest"), plus the
#   macOS .app zipped and attached to a matching GitHub Release.
# - Every push to main overwrites a single rolling "dev" pre-release (and
#   the "dev" container tag) with the current state of main -- not a
#   stable release, just a way to grab the latest build without waiting
#   for a version tag or building it yourself.
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine the image tag
        id: vars
        run: echo "tag=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build
        run: docker build -t "ghcr.io/williamcaban/audio-transcriber:${{ steps.vars.outputs.tag }}" -f Containerfile .
      - name: Push
        run: docker push "ghcr.io/williamcaban/audio-transcriber:${{ steps.vars.outputs.tag }}"
      - name: Also push "latest" for a real version tag
        if: github.ref_type == 'tag'
        run: |
          docker tag "ghcr.io/williamcaban/audio-transcriber:${{ steps.vars.outputs.tag }}" ghcr.io/williamcaban/audio-transcriber:latest
          docker push ghcr.io/williamcaban/audio-transcriber:latest

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra desktop
      - run: uv run python macos/setup.py py2app
      - name: Zip the .app bundle
        # ditto (not plain zip) preserves the bundle's resource forks and
        # extended attributes correctly.
        run: ditto -c -k --sequesterRsrc --keepParent "macos/dist/Audio Transcriber.app" Audio-Transcriber-macOS.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            NOTES="Container image: docker pull ghcr.io/williamcaban/audio-transcriber:$TAG . macOS app: unzip Audio-Transcriber-macOS.zip, then run: xattr -cr \"Audio Transcriber.app\" (it's unsigned) before opening, or right-click -> Open the first time instead of double-clicking."
            gh release create "$TAG" --title "Audio Transcriber $TAG" --notes "$NOTES" "Audio-Transcriber-macOS.zip"
          else
            TAG="dev"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --title "Development build (latest main)" \
                --notes "Automatically rebuilt and overwritten on every push to main. Not a stable release -- see tagged releases for those." \
                --prerelease
            fi
            gh release upload "$TAG" "Audio-Transcriber-macOS.zip" --clobber
          fi
