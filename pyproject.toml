[project]
name = "audio-transcriber"
version = "0.1.0"
description = "Transcribe audio/video to Markdown with NVIDIA Parakeet TDT 0.6B v3"
authors = [
    { name = "William Caban", email = "william.caban@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    "librosa>=0.10",
    "accelerate>=1.0",
    "numpy>=1.26",
    "torch>=2.3",
    # Parakeet TDT (AutoModelForTDT) isn't in a stable transformers release
    # yet; this tracks the tip of main. Pin to a commit once you've confirmed
    # a working version: transformers @ git+https://github.com/huggingface/transformers.git@<sha>
    "transformers @ git+https://github.com/huggingface/transformers.git",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
# tests/ has no __init__.py, so pytest's default rootdir-insertion puts
# tests/ itself on sys.path rather than the repo root -- add it explicitly
# so `from app.transcriber import ...` resolves.
pythonpath = ["."]

[tool.ruff.lint]
# B008: FastAPI's `File(...)`/`Depends(...)` in default args is the
# intentional, idiomatic pattern, not the "mutable default" bug this rule
# otherwise catches.
ignore = ["B008"]
