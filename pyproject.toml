[project]
name = "audio-transcriber"
version = "0.1.0"
description = "Transcribe audio/video to Markdown or Word with Qwen3-ASR or NVIDIA Parakeet TDT"
authors = [
    { name = "William Caban", email = "william.caban@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    "librosa>=0.10",
    "accelerate>=1.0",
    "numpy>=1.26",
    "torch>=2.3",
    # Parakeet TDT (AutoModelForTDT) isn't in a stable transformers release
    # yet; this tracks the tip of main. Pin to a commit once you've confirmed
    # a working version: transformers @ git+https://github.com/huggingface/transformers.git@<sha>
    "transformers @ git+https://github.com/huggingface/transformers.git",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# macOS desktop wrapper (macos/desktop_app.py) -- restricted to darwin so
# `uv sync` without this extra stays unaffected on Linux/CI/the container.
desktop = [
    "pywebview>=5.0; sys_platform == 'darwin'",
    # py2app bundles desktop_app.py into a double-clickable .app (see
    # macos/setup.py). Declared here, not installed ad hoc, because `uv run`
    # re-syncs the environment to match the lockfile before every run -- an
    # out-of-band `uv pip install py2app` gets silently removed the next
    # time `uv run` is invoked. Found via a real build attempt on macOS
    # (`error: invalid command 'py2app'` after it had installed and worked
    # moments before).
    "py2app>=0.28.8; sys_platform == 'darwin'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
# tests/ has no __init__.py, so pytest's default rootdir-insertion puts
# tests/ itself on sys.path rather than the repo root -- add it explicitly
# so `from app.asr... import ...` resolves.
pythonpath = ["."]
# pytest resets the warnings filter list per test, so the module-level
# warnings.filterwarnings() in app/asr/parakeet.py doesn't apply here even
# though it works fine outside pytest -- mirror it explicitly.
filterwarnings = ["ignore:Using the model-agnostic default .*max_length.*:UserWarning"]

[tool.ruff.lint]
# B008: FastAPI's `File(...)`/`Depends(...)` in default args is the
# intentional, idiomatic pattern, not the "mutable default" bug this rule
# otherwise catches.
ignore = ["B008"]
