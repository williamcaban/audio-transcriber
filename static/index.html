<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio Transcriber</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background: #0b0f14; }
  </style>
</head>
<body class="min-h-screen text-slate-100 font-sans">
  <div class="max-w-3xl mx-auto px-4 py-10">
    <header class="mb-8">
      <h1 class="text-2xl font-semibold tracking-tight">Audio Transcriber</h1>
      <p class="text-slate-400 text-sm mt-1">
        Drop an audio or video file to transcribe it to Markdown or Word.
      </p>
    </header>

    <section class="mb-4 flex flex-wrap gap-4">
      <div>
        <label for="model-select" class="block text-sm text-slate-300 mb-1">Model</label>
        <select id="model-select"
          class="w-full sm:w-64 bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100"></select>
      </div>
      <div id="language-section" class="hidden">
        <label for="language-select" class="block text-sm text-slate-300 mb-1">Source language</label>
        <select id="language-select"
          class="w-full sm:w-64 bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">
          <option value="auto">Auto-detect</option>
        </select>
      </div>
    </section>
    <p id="model-note" class="text-xs text-slate-500 mb-4"></p>

    <section>
      <label id="dropzone"
        class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-slate-700 rounded-xl py-14 cursor-pointer transition-colors hover:border-indigo-500 hover:bg-slate-900/40">
        <span class="text-slate-300">Drag a file here, or click to choose one</span>
        <span class="text-xs text-slate-500">mp3, wav, m4a, mp4, mov, mkv, ...</span>
        <input id="file-input" type="file" accept="audio/*,video/*" class="hidden" />
      </label>
    </section>

    <section id="status-section" class="mt-6 hidden">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 text-sm text-slate-300">
          <svg id="spinner" class="animate-spin h-4 w-4 text-indigo-400" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span id="status-text">Uploading...</span>
          <span id="elapsed-text" class="text-slate-500 tabular-nums"></span>
        </div>
        <button id="cancel-button" class="text-sm text-red-400 hover:text-red-300">Cancel</button>
      </div>
    </section>

    <section id="error-section" class="mt-6 hidden">
      <p class="text-sm text-red-400" id="error-text"></p>
    </section>

    <section id="result-section" class="mt-8 hidden">
      <p id="cancelled-note" class="text-sm text-amber-400 mb-3 hidden">
        Cancelled — showing the partial transcript completed before stopping.
      </p>
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
        <h2 class="text-sm font-medium text-slate-300">Transcript</h2>
        <div class="flex flex-wrap items-center gap-4">
          <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer select-none">
            <input id="timestamps-toggle" type="checkbox" checked
              class="rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-500" />
            Timestamps
          </label>
          <div class="flex gap-3">
            <button id="download-md" class="text-sm text-indigo-400 hover:text-indigo-300">Download .md</button>
            <button id="download-docx" class="text-sm text-indigo-400 hover:text-indigo-300">Download .docx</button>
          </div>
          <button id="new-button" class="text-sm text-slate-400 hover:text-slate-200">Transcribe another</button>
        </div>
      </div>
      <article id="markdown-output"
        class="prose prose-invert prose-sm max-w-none bg-slate-900/60 border border-slate-800 rounded-xl p-5"></article>
    </section>
  </div>

  <script>
    const modelSelect = document.getElementById("model-select");
    const languageSection = document.getElementById("language-section");
    const languageSelect = document.getElementById("language-select");
    const modelNote = document.getElementById("model-note");
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    const statusSection = document.getElementById("status-section");
    const statusText = document.getElementById("status-text");
    const elapsedText = document.getElementById("elapsed-text");
    const cancelButton = document.getElementById("cancel-button");
    const errorSection = document.getElementById("error-section");
    const errorText = document.getElementById("error-text");
    const resultSection = document.getElementById("result-section");
    const cancelledNote = document.getElementById("cancelled-note");
    const markdownOutput = document.getElementById("markdown-output");
    const timestampsToggle = document.getElementById("timestamps-toggle");
    const downloadMdButton = document.getElementById("download-md");
    const downloadDocxButton = document.getElementById("download-docx");
    const newButton = document.getElementById("new-button");

    let currentJobId = null;
    let models = {};
    let elapsedInterval = null;
    let elapsedBaseSeconds = 0;
    let elapsedBaseAt = 0;

    function formatElapsed(totalSeconds) {
      const s = Math.floor(totalSeconds);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${String(r).padStart(2, "0")}`;
    }

    function startElapsedTimer(baseSeconds) {
      elapsedBaseSeconds = baseSeconds;
      elapsedBaseAt = Date.now();
      elapsedText.textContent = formatElapsed(elapsedBaseSeconds);
      stopElapsedTimer();
      elapsedInterval = setInterval(() => {
        const ticked = elapsedBaseSeconds + (Date.now() - elapsedBaseAt) / 1000;
        elapsedText.textContent = formatElapsed(ticked);
      }, 1000);
    }

    function stopElapsedTimer() {
      if (elapsedInterval) {
        clearInterval(elapsedInterval);
        elapsedInterval = null;
      }
    }

    const MODEL_NOTES = {
      parakeet: "Native word-level timestamps. Language is always auto-detected — this model has no way to force a specific language.",
      qwen3: "Supports forcing a source language and reports what it detected. Timestamps are chunk-level (~30s), not word-level.",
    };

    async function loadModels() {
      const resp = await fetch("/api/models");
      models = await resp.json();

      modelSelect.innerHTML = "";
      for (const [key, model] of Object.entries(models)) {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = model.name;
        modelSelect.appendChild(option);
      }
      updateModelUI();
    }

    function updateModelUI() {
      const model = models[modelSelect.value];
      if (!model) return;

      modelNote.textContent = MODEL_NOTES[modelSelect.value] || "";

      if (model.supports_language_selection) {
        languageSection.classList.remove("hidden");
        languageSelect.innerHTML = '<option value="auto">Auto-detect</option>';
        for (const [code, name] of Object.entries(model.languages)) {
          const option = document.createElement("option");
          option.value = code;
          option.textContent = name;
          languageSelect.appendChild(option);
        }
      } else {
        languageSection.classList.add("hidden");
      }
    }

    loadModels();
    modelSelect.addEventListener("change", updateModelUI);

    const STATUS_LABELS = {
      queued: "Queued...",
      extracting_audio: "Extracting audio...",
      transcribing: "Transcribing (this can take a while for long files)...",
      done: "Done",
      error: "Failed",
    };

    function resetUI() {
      currentJobId = null;
      stopElapsedTimer();
      cancelButton.disabled = false;
      cancelButton.textContent = "Cancel";
      cancelledNote.classList.add("hidden");
      statusSection.classList.add("hidden");
      errorSection.classList.add("hidden");
      resultSection.classList.add("hidden");
      fileInput.value = "";
    }

    function showError(message) {
      statusSection.classList.add("hidden");
      errorSection.classList.remove("hidden");
      errorText.textContent = message;
    }

    async function refreshPreview() {
      if (!currentJobId) return;
      const resp = await fetch(`/api/jobs/${currentJobId}/markdown?timestamps=${timestampsToggle.checked}`);
      const { markdown } = await resp.json();
      markdownOutput.innerHTML = marked.parse(markdown);
    }

    function downloadFile(format) {
      if (!currentJobId) return;
      const url = `/api/jobs/${currentJobId}/download?format=${format}&timestamps=${timestampsToggle.checked}`;
      window.location.href = url;
    }

    async function pollJob(jobId) {
      const resp = await fetch(`/api/jobs/${jobId}`);
      if (!resp.ok) {
        showError("Lost track of this job.");
        return;
      }
      const job = await resp.json();

      if (job.status === "error") {
        stopElapsedTimer();
        showError(job.error || "Transcription failed.");
        return;
      }

      statusText.textContent = STATUS_LABELS[job.status] || job.status;
      if (elapsedInterval === null) {
        startElapsedTimer(job.elapsed_seconds);
      }

      if (job.status === "done" || job.status === "cancelled") {
        stopElapsedTimer();
        currentJobId = jobId;
        cancelledNote.classList.toggle("hidden", job.status !== "cancelled");
        await refreshPreview();
        statusSection.classList.add("hidden");
        resultSection.classList.remove("hidden");
        return;
      }

      setTimeout(() => pollJob(jobId), 2000);
    }

    async function cancelCurrentUpload(jobId) {
      cancelButton.disabled = true;
      cancelButton.textContent = "Cancelling...";
      try {
        await fetch(`/api/jobs/${jobId}/cancel`, { method: "POST" });
      } catch (err) {
        console.error("Failed to request cancellation:", err);
      }
    }

    async function uploadFile(file) {
      resetUI();
      statusSection.classList.remove("hidden");
      statusText.textContent = "Uploading...";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("backend", modelSelect.value);
      formData.append("language", languageSection.classList.contains("hidden") ? "auto" : languageSelect.value);

      try {
        const resp = await fetch("/api/jobs", { method: "POST", body: formData });
        if (!resp.ok) {
          showError("Upload failed.");
          return;
        }
        const { job_id } = await resp.json();
        currentJobId = job_id;
        pollJob(job_id);
      } catch (err) {
        showError(String(err));
      }
    }

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("border-indigo-500");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("border-indigo-500"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("border-indigo-500");
      if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) uploadFile(fileInput.files[0]);
    });

    cancelButton.addEventListener("click", () => {
      if (currentJobId) cancelCurrentUpload(currentJobId);
    });
    timestampsToggle.addEventListener("change", refreshPreview);
    downloadMdButton.addEventListener("click", () => downloadFile("md"));
    downloadDocxButton.addEventListener("click", () => downloadFile("docx"));
    newButton.addEventListener("click", resetUI);
  </script>
</body>
</html>
